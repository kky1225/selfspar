# 이름을 적지 않으면 폴더 이름이 쓰인다. 폴더 위치와 상관없이 같은 이름을 쓰도록 고정한다.
name: selfspar-backend

services:
  db:
    image: postgres:18
    env_file: .env
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql 아래에 데이터를 둔다.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ports가 없다: DB는 web 컨테이너에서만 접속할 수 있고 내 컴퓨터 밖으로 열리지 않는다.

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      # 코드를 고치면 컨테이너를 다시 만들지 않아도 바로 반영된다.
      - .:/app
    ports:
      # 127.0.0.1에만 연다. 같은 와이파이의 다른 기기에서는 접속할 수 없다.
      # 8000번은 다른 프로젝트가 쓰고 있어서 내 컴퓨터 쪽은 8800번을 쓴다.
      - "127.0.0.1:8800:8000"
    depends_on:
      db:
        # DB가 접속을 받을 준비가 된 뒤에 web을 띄운다.
        condition: service_healthy

volumes:
  pgdata:
