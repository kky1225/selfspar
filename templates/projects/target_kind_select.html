{% extends 'base.html' %}

{% block title %}대상 추가 - selfspar{% endblock %}

{% block content %}
  <h1>{{ project.name }}: 대상 추가</h1>
  <p>어떤 대상을 추가할까요?</p>
  <ul>
    {% for value, label in kinds %}
      <li><a href="{% url 'target_create' project.pk value %}">{{ label }}</a></li>
    {% endfor %}
  </ul>
  <a href="{% url 'project_detail' project.pk %}">취소</a>
{% endblock %}
